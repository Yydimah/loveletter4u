<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kumpulan photocard dan kenangan manis." />
  <title>Our Photocards ♡</title>
  <link rel="icon" type="image/png" href="./love.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./photocard.css" />
</head>
<body>
  <main class="gallery">
    <a class="back-link" href="./index.html"><span aria-hidden="true">←</span> Kembali ke surat</a>

    <header class="gallery__heading">
      <p class="eyebrow">A LITTLE MEMORY LANE</p>
      <h1>Our Photocards <span aria-hidden="true">♡</span></h1>
      <p class="gallery__intro">Kenangan kecil yang selalu ingin kita simpan.</p>
    </header>

    <section class="rail" aria-label="Galeri photocard berjalan; fokuskan galeri untuk menghentikan animasi" tabindex="0">
      <div class="rail__track">
        <div class="rail__set">
          <figure class="photocard photocard--photo">
            <div class="photocard__image">
              <img src="./pth.JPG" alt="Foto kenangan kita bersama" />
              <span class="photocard__sparkle" aria-hidden="true">✦</span>
            </div>
            <figcaption>
              <span class="photocard__label">OUR MEMORY</span>
              <span class="photocard__caption">Us, always ♡</span>
            </figcaption>
          </figure>

          <figure class="photocard photocard--photo">
            <div class="photocard__image">
              <img src="./pth1.JPG" alt="Foto kenangan pertama" />
              <span class="photocard__sparkle" aria-hidden="true">✦</span>
            </div>
            <figcaption>
              <span class="photocard__label">OUR MEMORY</span>
              <span class="photocard__caption">A sweet moment ♡</span>
            </figcaption>
          </figure>

          <figure class="photocard photocard--photo">
            <div class="photocard__image">
              <img src="./pth2.jpeg" alt="Foto kenangan kedua" />
              <span class="photocard__sparkle" aria-hidden="true">✦</span>
            </div>
            <figcaption>
              <span class="photocard__label">OUR MEMORY</span>
              <span class="photocard__caption">Another lovely day ♡</span>
            </figcaption>
          </figure>
        </div>

        <div class="rail__set" aria-hidden="true">
          <figure class="photocard photocard--photo">
            <div class="photocard__image">
              <img src="./pth.JPG" alt="" />
              <span class="photocard__sparkle">✦</span>
            </div>
            <figcaption>
              <span class="photocard__label">OUR MEMORY</span>
              <span class="photocard__caption">Us, always ♡</span>
            </figcaption>
          </figure>

          <figure class="photocard photocard--photo">
            <div class="photocard__image">
              <img src="./pth1.JPG" alt="" />
              <span class="photocard__sparkle">✦</span>
            </div>
            <figcaption>
              <span class="photocard__label">OUR MEMORY</span>
              <span class="photocard__caption">A sweet moment ♡</span>
            </figcaption>
          </figure>

          <figure class="photocard photocard--photo">
            <div class="photocard__image">
              <img src="./pth2.jpeg" alt="" />
              <span class="photocard__sparkle">✦</span>
            </div>
            <figcaption>
              <span class="photocard__label">OUR MEMORY</span>
              <span class="photocard__caption">Another lovely day ♡</span>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

    <p class="gallery__hint">Arahkan kursor atau fokuskan galeri untuk menghentikan bingkai ♡</p>
  </main>
</body>
</html>
